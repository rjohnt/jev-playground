<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Feeling it — Jev sentiment</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ee;color:#282c28;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1000px;margin:70px auto;padding:24px}.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#737970}h1{font-family:Georgia,serif;font-size:64px;font-weight:400;letter-spacing:-3px;margin:18px 0 12px}p{color:#777c73;line-height:1.6}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:35px 0 24px}.card{padding:22px 12px 16px;border:1px solid #dddcd3;border-radius:20px;text-align:center;transition:.25s;background:#faf9f5}.card{position:relative;overflow:hidden;isolation:isolate}.card::before{content:"";position:absolute;inset:auto 0 0;height:var(--fill,0%);background:linear-gradient(0deg,#d9dcd7,#eceee9);z-index:-1;transition:height .55s cubic-bezier(.2,.7,.3,1)}.face{display:grid;place-items:center;width:66px;height:66px;margin:0 auto 12px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:42px;line-height:1;background:radial-gradient(circle,#fff9e9 0%,#fff9e900 72%);filter:drop-shadow(0 3px 3px #806b3114);transition:transform .3s}.card.active .face{transform:translateY(-2px) scale(1.08)}.label{font-size:13px;font-weight:600}.prob{font-size:11px;color:#81877e;margin-top:10px;min-height:13px}.card.active::before{background:linear-gradient(0deg,#c9df94,#e4efc8)}.card.active{background:#faf9f5;border-color:#8da456;box-shadow:0 0 0 3px #cddda255;transform:translateY(-4px)}.editor{background:white;border:1px solid #e1e1d8;border-radius:24px;padding:24px}label{font-size:13px;color:#62685e}textarea{display:block;width:100%;border:none;resize:vertical;min-height:150px;font-family:inherit;font-size:20px;line-height:1.6;color:#343b31;margin-top:16px;outline:none;background:transparent}textarea:focus-visible{box-shadow:inset 0 -2px #8da456}footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #efefe8;padding-top:18px;gap:12px}button{background:#303c2b;color:white;border:0;border-radius:24px;padding:12px 20px;cursor:pointer}button:disabled{opacity:.5;cursor:default}#status{font-size:13px;color:#6d7567}#confidence{margin:18px 0 5px;font-size:15px;min-height:22px}.note{font-size:11px}.examples{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.examples button{background:transparent;color:#6e7569;border:1px solid #dcded2;padding:8px 14px;font-size:12px}@media(max-width:600px){main{margin:20px auto}h1{font-size:48px}.cards{grid-template-columns:repeat(2,1fr)}.card{padding:14px}footer{align-items:flex-start}}
</style><main><div class="eyebrow">A little emotional intelligence · Powered by Jev</div><h1>Feeling it.</h1><p>Words carry a mood. Discover the feeling behind yours.</p><div class="cards" id="cards"></div><div class="editor"><label for="text">WHAT’S ON YOUR MIND?</label><textarea id="text" maxlength="5000" placeholder="Write a message, paste a review, or tell us how your day went…"></textarea><footer><span id="status" role="status" aria-live="polite">Start typing to discover the tone.</span><button id="analyze" disabled>Analyze ↗</button></footer></div><div class="examples"><button data-text="I finally finished the project! I can't wait to share it with everyone!">A little excitement</button><button data-text="Great, another meeting that could have been an email. Living the dream.">A touch of sarcasm</button><button data-text="I miss you more than I expected. Everything feels quieter without you here.">Something heartfelt</button></div><div id="confidence" aria-live="polite"></div><p class="note">Confidence reflects how clearly one label stands out. Tone can be subjective.</p></main>
<script>
const emotions=[['happy','☺️','Happy'],['sad','🥺','Sad'],['neutral','😐','Neutral'],['funny','😆','Funny'],['angry','😤','Angry'],['anxious','😟','Anxious'],['excited','🤩','Excited'],['affectionate','🥰','Affectionate'],['confused','😵‍💫','Confused'],['mixed','🫠','Mixed']];
const cards=document.querySelector('#cards'),input=document.querySelector('#text'),status=document.querySelector('#status'),confidence=document.querySelector('#confidence'),button=document.querySelector('#analyze');
for(const [key,face,label]of emotions){const card=document.createElement('div');card.className='card';card.id=key;card.innerHTML='<span class="face" aria-hidden="true">'+face+'</span><div class="label">'+label+'</div><div class="prob"></div>';cards.append(card);}
let timer,revision=0,controller;
function reset(){document.querySelectorAll('.card').forEach(c=>{c.classList.remove('active');c.removeAttribute('aria-label');c.style.setProperty('--fill','0%');c.querySelector('.prob').textContent=''});confidence.textContent='';}
async function analyze(){clearTimeout(timer);const text=input.value.trim();if(!text)return;const version=revision;controller?.abort();controller=new AbortController();status.textContent='Reading the room…';button.disabled=true;try{const response=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text}),signal:controller.signal});const data=await response.json();if(version!==revision)return;if(!response.ok)throw new Error(data.error);reset();const selected=document.getElementById(data.choice);selected.classList.add('active');selected.style.setProperty('--fill',Math.round(data.confidence*100)+'%');selected.setAttribute('aria-label',emotions.find(e=>e[0]===data.choice)[2]+', '+Math.round(data.confidence*100)+'% confidence');for(const [key]of emotions){const card=document.getElementById(key);const probability=Math.round((data.probabilities?.[key]||0)*100);if(key!==data.choice){card.style.setProperty('--fill',probability+'%');card.setAttribute('aria-label',emotions.find(e=>e[0]===key)[2]+', '+probability+'% probability');}card.querySelector('.prob').textContent=probability+'% probability';}const label=emotions.find(e=>e[0]===data.choice)[2];confidence.textContent=label+' · '+Math.round(data.confidence*100)+'% confidence';status.textContent='Analysis complete.';}catch(error){if(version!==revision||error.name==='AbortError')return;status.textContent=error.message||'Something went wrong.';}finally{if(version===revision)button.disabled=!input.value.trim();}}
input.addEventListener('input',()=>{revision++;controller?.abort();clearTimeout(timer);reset();button.disabled=!input.value.trim();status.textContent=input.value.trim()?'Waiting for your next thought…':'Start typing to discover the tone.';if(input.value.trim())timer=setTimeout(analyze,700);});button.onclick=analyze;document.querySelectorAll('[data-text]').forEach(b=>b.onclick=()=>{input.value=b.dataset.text;input.dispatchEvent(new Event('input'));input.focus();});
</script></html>
